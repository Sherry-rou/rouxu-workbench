<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
<title>柔序工作台</title>
<desc>满幅绿色底，白色「柔」字居中</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#93C7A1"/>
<stop offset="1" stop-color="#699E7A"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
<stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<filter id="cs" x="-25%" y="-25%" width="150%" height="150%">
<feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#2F5A3D" flood-opacity="0.26"/>
</filter>
</defs>
<rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
<rect x="0" y="0" width="512" height="512" fill="url(#sheen)"/>
<text x="256" y="262" text-anchor="middle" dominant-baseline="central"
 font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" font-size="238" font-weight="600" fill="#FFFFFF"
 filter="url(#cs)">柔</text>
</svg>
