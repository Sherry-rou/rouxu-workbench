<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7BAE8C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="柔序">
  <meta name="description" content="柔序工作台 — 个人效率与生活记录工具，所有数据仅保存在本地浏览器">
  <title>柔序工作台</title>
  <script>
    /* 提前应用主题，避免深色模式首屏闪白 */
    (function () {
      try {
        var p = localStorage.getItem('workbench.theme') || 'auto';
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        var d = p === 'auto' ? (mql.matches ? 'dark' : 'light') : p;
        document.documentElement.setAttribute('data-theme', d);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 隐私提醒弹窗 -->
  <div class="modal-overlay" id="privacy-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="privacy-title">
      <svg class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="#7BAE8C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h2 class="modal-title" id="privacy-title">隐私提醒</h2>
      <p class="modal-text">柔序工作台所有数据仅保存在你的本地浏览器，不会上传任何服务器。</p>
      <button class="btn btn-primary btn-block" id="privacy-close">我知道了</button>
    </div>
  </div>

  <!-- 应用主体 -->
  <div class="app">

    <!-- 固定左侧导航栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img class="brand-mark" src="icons/logo.svg" alt="" width="40" height="40">
          <div class="brand-text">
            <span class="brand-name">柔序工作台</span>
            <span class="brand-sub">个人效率 · 生活记录</span>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="主导航"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="main">
      <div class="content" id="content"></div>
    </main>

  </div>

  <!-- 导入备份文件（隐藏输入框） -->
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
